name: Weekly Report

on:
  # 每周一 09:00 北京时间 = UTC 周一 01:00（周报在周一晨会前送达）
  # 双触发避免 GitHub schedule 偶发静默跳过；第二次内容相同，无副作用。
  schedule:
    - cron: "0 1 * * 1"
    - cron: "30 1 * * 1"
  workflow_dispatch:
    inputs:
      baseline:
        description: "基准日期 YYYY-MM-DD（留空自动取 7 天前）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 分析层本身只用标准库；pycryptodome 供抓取适配器解接口响应
        run: pip install pycryptodome

      - name: Generate weekly report
        # 读 data/daily/*.json + data/diff/*.json，产出 reports/weekly-<date>.{md,html,json}
        env:
          GRAVITY_BASELINE: ${{ github.event.inputs.baseline }}
        run: |
          if [ -n "$GRAVITY_BASELINE" ]; then
            python scripts/monitor/report.py --format both --baseline "$GRAVITY_BASELINE"
          else
            python scripts/monitor/report.py --format both
          fi

      - name: Commit & push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "周报无变化，跳过提交。"
            exit 0
          fi
          DATE=$(date -u -d "+8 hours" +%F)
          git commit -m "report: weekly $DATE"
          git push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          retention-days: 30

      - name: Send weekly report email
        # 走企业微信邮箱 / 腾讯企业邮 SMTP（smtp.exmail.qq.com:465 SSL）。
        # 未配置 MAIL_USER 时自动跳过，不影响报告生成与提交。
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASS" ] || [ -z "$MAIL_TO" ]; then
            echo "::warning::未配置邮件 Secrets（MAIL_USER / MAIL_PASS / MAIL_TO），跳过发送。"
            exit 0
          fi
          python scripts/monitor/send_mail.py --latest
